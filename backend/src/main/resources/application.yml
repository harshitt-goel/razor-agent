server:
  port: ${PORT:8080}

spring:
  application:
    name: razoragent-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:razoragentdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: ${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
    hibernate:
      ddl-auto: ${SPRING_JPA_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate.format_sql: true

razorpay:
  key-id: ${RAZORPAY_KEY_ID:rzp_test_mockkey12345}
  key-secret: ${RAZORPAY_KEY_SECRET:mocksecret67890}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:mockwebhooksecret}
  merchant-name: RazorAgent Hackathon Store
  currency: INR

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-1.5-pro}

logging:
  level:
    root: INFO
    com.razoragent: DEBUG
